<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Fórmula 1</title>
    <link rel="stylesheet" href="style.css" />
    
    
  </head>

  <body>
    <header class="header">
      <img class="logo" src="assets/f1-logo-vermelha.png" alt="Logo Fórmula 1"/>
        <nav class="menu">
        
        <a href="#" class="active">INÍCIO</a>
        <a href="#"> PILOTOS</a>
        <a href="#">EQUIPES</a>
        <a href="#">CALENDÁRIO</a>
        <a href="#">RESULTADOS</a>
        <a href="#">ESTATÍSTICAS</a>
        <a href="#">QUIZ</a>
        <a href="#">SOBRE</a>
        </nav>
      
    </header>

    <main class="driver">
      <img class="driver-photo" src="assets/Verstappen.png" alt="Foto de Max Verstappen">
        <div class="team"><p>RED BULL RACING</p>
          </div>
      <h1 class="driver-name">MAX</h1>
      <h1 class="driver-surname">VERSTAPPEN</h1>
     
      <div class="driver-info">
      <img src="assets/flag-netherlands.png"  alt="">
      <span>Países Baixos </span><span class="pipe">|</span><span>#33</span>
    
      </div>

      <div class="driver-phrase">
          <em>"Sempre tento ser a melhor versão de mim mesmo,<br>
            dentro e fora da pista"
          </em>
        </div>

      
      <dl class="driver-stats" aria-label="Estatísticas de Max Verstappen">
        <div class="driver-stat">
          <dt>VITÓRIAS</dt>
          <dd>
            <img class="stat-icon" src="assets/icons/trophy.svg" alt="" width="24" height="24">
            <span>61</span>
          </dd>
        </div>

        <div class="driver-stat">
          <dt>PÓDIOS</dt>
          <dd>
            <img class="stat-icon" src="assets/icons/podium.svg" alt="" width="24" height="24">
            <span>110</span>
          </dd>
        </div>

        <div class="driver-stat">
          <dt>POLES</dt>
          <dd>
            <img class="stat-icon" src="assets/icons/stopwatch.svg" alt="" width="24" height="24">
            <span>40</span>
          </dd>
        </div>

        <div class="driver-stat">
          <dt>PONTOS</dt>
          <dd>
            <img class="stat-icon" src="assets/icons/star.svg" alt="" width="24" height="24">
            <span>2.654</span>
          </dd>
        </div>
      </dl>

      <div class="team-info">
        <img class="team-logo" src="assets/logo-rbatt.png" alt="Logo da Red Bull Racing">
        <div class="team-name">
          <p>Equipe</p>
        </div>
      </div>

      


    </main>

  </body>
</html>
